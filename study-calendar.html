<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Calendar</title>
<style>
:root{--radius:16px;--radius-sm:10px;--shadow:0 12px 32px rgba(15,23,42,.10);--shadow-lg:0 20px 50px rgba(15,23,42,.14)}
html[data-theme="dark"]{--bg:#0b0e14;--bg-grad-1:rgba(124,140,255,.10);--bg-grad-2:rgba(79,224,193,.06);--surface:#12161f;--surface-2:#161b26;--surface-hover:#1b202c;--border:#232a38;--border-soft:#1a202c;--text:#eef1f6;--text-dim:#9aa5b8;--text-faint:#5c6579;--accent:#8b93ff;--accent-2:#4fe0c1;--accent-ink:#0a0d16;--danger:#ff8aa3;--danger-bg:rgba(255,111,145,.12);--chip-bg:#1a2030;--chip-border:#2a3348;--scrim:rgba(6,8,12,.55)}
html[data-theme="light"]{--bg:#f6f7fb;--bg-grad-1:rgba(124,140,255,.10);--bg-grad-2:rgba(79,224,193,.10);--surface:#ffffff;--surface-2:#fbfbfe;--surface-hover:#f1f2f9;--border:#e4e7f0;--border-soft:#edeff5;--text:#161a24;--text-dim:#5b6478;--text-faint:#98a0b3;--accent:#5b63e6;--accent-2:#16a087;--accent-ink:#ffffff;--danger:#e0466f;--danger-bg:rgba(224,70,111,.08);--chip-bg:#f1f2f9;--chip-border:#e4e7f0;--scrim:rgba(20,24,36,.35)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 8% -10%,var(--bg-grad-1),transparent 55%),radial-gradient(800px 500px at 100% 0%,var(--bg-grad-2),transparent 55%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;transition:background-color .2s ease,color .2s ease;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
::selection{background:var(--accent);color:var(--accent-ink)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:var(--accent)}
.app{max-width:1400px;margin:auto;padding:26px 28px 60px}
.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap}
.hero h1{font-size:clamp(26px,3.4vw,40px);line-height:1.05;margin:0;letter-spacing:-.03em;font-weight:800}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 13px;border-radius:11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.15s ease}
.btn:hover{border-color:var(--accent);background:var(--surface-hover);transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}.btn.primary:hover{filter:brightness(1.06)}
.btn.icon{padding:9px;width:38px;justify-content:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;transition:transform .15s ease,box-shadow .15s ease}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat .label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.stat .value{font-size:24px;font-weight:800;margin-top:4px;letter-spacing:-.02em}
.progress{height:6px;background:var(--border-soft);border-radius:99px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:inherit;transition:width .3s ease}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.sidebar{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.panel h2{font-size:12px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);font-weight:800}
.pillset{display:flex;flex-direction:column;gap:6px}
.pill{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:var(--radius-sm);padding:9px 10px;font-size:13px;font-weight:600;color:var(--text-dim);transition:.15s ease}
.pill:hover{background:var(--surface-hover);color:var(--text)}
.pill.active{background:var(--chip-bg);border-color:var(--chip-border);color:var(--text)}
.pill .dot{width:8px;height:8px;border-radius:99px;flex:0 0 auto}
.pill .name{flex:1;display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill .count{font-size:11px;color:var(--text-faint);font-weight:700}
.legend{display:flex;flex-direction:column;gap:7px;margin-top:2px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim)}
.legend-item .dot{width:8px;height:8px;border-radius:99px}
.signature{font-family:"Snell Roundhand","Bradley Hand","Segoe Script","Lucida Handwriting",cursive;font-size:28px;text-align:center;margin-top:16px;padding:10px 0;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5px;font-weight:600}
.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.month-nav{display:flex;gap:6px;align-items:center}
.month-title{font-size:20px;font-weight:800;min-width:190px;letter-spacing:-.01em}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.weekday{font-size:10px;color:var(--text-faint);padding:2px 6px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;text-align:center}
.day{min-height:92px;border:1px solid var(--border);background:var(--surface-2);border-radius:13px;padding:9px;overflow:hidden;transition:transform .15s ease,border-color .15s ease,background .15s ease;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.day:hover{border-color:var(--accent);background:var(--surface-hover);transform:translateY(-2px)}
.day.out{opacity:.4}.day.out:hover{opacity:.6;transform:none}
.day.empty-day{cursor:default}.day.empty-day:hover{border-color:var(--border);background:var(--surface-2);transform:none}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent)}
.day-num{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:var(--text-dim)}
.day.today .day-num{color:var(--accent)}
.load{font-size:9px;color:var(--text-faint);font-weight:700;text-transform:uppercase}
.day-progress{height:3px;background:var(--border-soft);border-radius:99px;overflow:hidden;margin-top:1px}
.day-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:inherit}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 7px 3px 5px;border-radius:99px;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);line-height:1.3}
.chip .dot{width:6px;height:6px;border-radius:99px;flex:0 0 auto}
.chip.all-done{opacity:.5}

.day-modal-overlay{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:8vh 20px 20px;z-index:60;opacity:0;transition:opacity .2s ease;overflow-y:auto}
.day-modal-overlay.open{display:flex;opacity:1}
.day-modal{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:18px;display:block;transform:scale(.96);transition:transform .2s cubic-bezier(.2,.8,.2,1);margin-bottom:8vh}
.day-modal-overlay.open .day-modal{transform:scale(1)}
.day-modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.day-modal-title{font-size:17px;font-weight:800;letter-spacing:-.01em}
.day-modal-sub{font-size:12px;color:var(--text-faint);margin-top:2px}
.day-modal-list{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.course-group{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface-2)}
.course-group-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;background:var(--surface);user-select:none;transition:background .15s ease}
.course-group-head:hover{background:var(--surface-hover)}
.cg-left{display:flex;align-items:center;gap:10px}
.cg-dot{width:8px;height:8px;border-radius:99px}
.cg-name{font-weight:700;font-size:14px}
.cg-right{display:flex;align-items:center;gap:10px}
.cg-count{font-size:11px;color:var(--text-faint);font-weight:700;background:var(--chip-bg);padding:3px 8px;border-radius:99px}
.cg-chevron{font-size:10px;transition:transform .2s ease;color:var(--text-faint)}
.course-group.expanded .cg-chevron{transform:rotate(180deg)}

.course-group-tasks{display:flex;flex-direction:column;gap:7px;max-height:0;overflow:hidden;opacity:0;padding:0 10px;transition:max-height .3s cubic-bezier(.2,.8,.2,1),opacity .2s ease,padding .3s cubic-bezier(.2,.8,.2,1);border-top:1px solid transparent}
.course-group.expanded .course-group-tasks{max-height:500px;opacity:1;padding:10px;border-top:1px solid var(--border)}

.task{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;background:var(--surface);border:1px solid var(--border);border-radius:11px;transition:.15s ease}
.task:hover{border-color:var(--accent)}
.task.done{opacity:.55}
.task input{accent-color:var(--accent);margin-top:2px;flex:0 0 auto;width:16px;height:16px}
.task-main{min-width:0;flex:1}
.task-title{font-size:13px;font-weight:700;line-height:1.35}
.task.done .task-title{text-decoration:line-through}
.task-meta{font-size:10.5px;color:var(--text-faint);margin-top:4px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.kind-dot{width:6px;height:6px;border-radius:99px;flex:0 0 auto}
.search-overlay{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:8vh 20px 20px;z-index:50;opacity:0;transition:opacity .2s ease;overflow-y:auto}
.search-overlay.open{display:flex;opacity:1}
.search-panel{width:100%;max-width:640px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:16px;margin-bottom:8vh;display:flex;flex-direction:column;transform:scale(.96);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.search-overlay.open .search-panel{transform:scale(1)}
.search-panel .calendar-head{margin-bottom:10px}
.search-input{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:11px 13px;border-radius:11px;margin-bottom:10px;font-size:14px}
.search-input:focus{outline:none;border-color:var(--accent)}
.search-results{overflow:auto}
.result{padding:10px 4px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;gap:10px;align-items:center}
.result:last-child{border:0}
.result b{display:block;font-size:13px}
.result small{color:var(--text-faint);font-size:11px}
.result-tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--chip-bg);color:var(--text-dim);white-space:nowrap}
.empty{padding:26px;text-align:center;color:var(--text-faint);font-size:13px}
@media(max-width:1050px){.layout{grid-template-columns:1fr}.sidebar{position:static}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.app{padding:16px}.stats{grid-template-columns:1fr 1fr}.calendar{gap:4px}.day{min-height:120px;padding:6px;border-radius:10px}.task{padding:5px;gap:5px}.task-title{font-size:10px}.task-meta{font-size:8px}.weekday{font-size:9px;padding:2px}.month-title{min-width:0;font-size:17px}}
</style>
</head>
<body>
<div class="app">
  <header class="hero"><div><h1>Study Calendar</h1></div>
    <div class="actions">
      <button class="btn primary" id="todayBtn">Today</button>
      <button class="btn" id="searchBtn">Search</button>
      <button class="btn icon" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">🌙</button>
    </div>
  </header>
  <section class="stats">
    <div class="stat"><div class="label">All activities</div><div class="value" id="allCount">0</div></div>
    <div class="stat"><div class="label">Completed</div><div class="value" id="doneCount">0</div></div>
    <div class="stat"><div class="label">Remaining</div><div class="value" id="remainingCount">0</div></div>
    <div class="stat"><div class="label">Progress</div><div class="value" id="progressText">0%</div><div class="progress"><i id="progressBar"></i></div></div>
  </section>
  <div class="layout">
    <aside class="sidebar">
      <section class="panel"><h2>Courses</h2><div class="pillset" id="coursePills"></div></section>
      <section class="panel"><h2>Activity type</h2><div class="legend" id="kindLegend"></div></section>
      <div class="signature">Made by Manaf Elfarra</div>
    </aside>
    <main>
      <section class="panel">
        <div class="calendar-head">
          <div class="month-title" id="monthTitle"></div>
          <div class="month-nav">
            <button class="btn icon" id="prevBtn">←</button>
            <button class="btn icon" id="nextBtn">→</button>
          </div>
        </div>
        <div class="calendar" id="calendar"></div>
      </section>
    </main>
  </div>
</div>
<div class="day-modal-overlay" id="dayModalOverlay">
  <div class="day-modal">
    <div class="day-modal-head">
      <div><div class="day-modal-title" id="dayModalTitle"></div><div class="day-modal-sub" id="dayModalSub"></div></div>
      <div style="display:flex;gap:6px;">
        <button class="btn icon" id="prevDayBtn" title="Previous day">←</button>
        <button class="btn icon" id="nextDayBtn" title="Next day">→</button>
        <button class="btn icon" id="closeDayModal">✕</button>
      </div>
    </div>
    <div class="day-modal-list" id="dayModalList"></div>
  </div>
</div>
<div class="search-overlay" id="searchOverlay">
  <div class="search-panel">
    <div class="calendar-head">
      <h2 style="margin:0;font-size:15px;font-weight:800;">Search all activities</h2>
      <button class="btn icon" id="closeSearch">✕</button>
    </div>
    <input class="search-input" id="searchInput" placeholder="Search by course, module, title, quiz, exam…">
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

// Pre-calculate exact weekdays from Sep 7 to Jan 29
const validDates=[];let tempDate=new Date("2026-09-07T00:00:00");const hardEndDate=new Date("2027-01-29T00:00:00");
while(tempDate<=hardEndDate){if(tempDate.getDay()!==0&&tempDate.getDay()!==6){validDates.push(new Date(tempDate.getTime()))}tempDate.setDate(tempDate.getDate()+1)}

// Build Proportional Padding Queue to ensure perfectly even interleaving
const courseOrder = DATA.courses.map(c=>c.name);
const courses = {};
DATA.scheduled.forEach(item=>{if(!courses[item.course])courses[item.course]=[];courses[item.course].push(item)});

let maxLen = 0;
for(const name of courseOrder) { if(courses[name].length > maxLen) maxLen = courses[name].length; }

const paddedCourses = {};
for (const name of courseOrder) {
    const items = courses[name];
    const padded = new Array(maxLen).fill(null);
    for (let i = 0; i < items.length; i++) {
        const targetSlot = Math.floor(i * maxLen / items.length);
        let slot = targetSlot;
        while (slot < maxLen && padded[slot] !== null) { slot++; }
        if (slot >= maxLen) { for (let k = 0; k < maxLen; k++) { if (padded[k] === null) { slot = k; break; } } }
        padded[slot] = items[i];
    }
    paddedCourses[name] = padded;
}

const queue = [];
for (let i = 0; i < maxLen; i++) {
    for (const name of courseOrder) {
        if (paddedCourses[name][i] !== null) { queue.push(paddedCourses[name][i]); }
    }
}

// Distribute across days
const scheduledList = [];
const numItems = queue.length;
const numDays = validDates.length;
const baseItemsPerDay = Math.floor(numItems / numDays);
const extraItems = numItems % numDays;

for (let i = 0; i < numDays; i++) {
    const dateObj = validDates[i];
    const yyyy = dateObj.getFullYear();
    const mm = String(dateObj.getMonth()+1).padStart(2,'0');
    const dd = String(dateObj.getDate()).padStart(2,'0');
    const dateStr = `${yyyy}-${mm}-${dd}`;
    
    let itemsForToday = baseItemsPerDay;
    if (i < extraItems) itemsForToday++;
    
    for (let j = 0; j < itemsForToday && queue.length > 0; j++) {
        const item = queue.shift();
        item.date = dateStr;
        scheduledList.push(item);
    }
}

// Post-process: Move duplicate exams for the same course backwards if needed
const byDate = {};
for (const item of scheduledList) { (byDate[item.date] ||= []).push(item); }
const sortedDates = Object.keys(byDate).sort();

for (let i = sortedDates.length - 1; i >= 0; i--) {
    const date = sortedDates[i];
    const items = byDate[date];
    const examsByCourse = {};
    const itemsToKeep = [];
    const itemsToMove = [];

    for (const item of items) {
        if (item.kind === "Exam") {
            if (examsByCourse[item.course]) {
                itemsToMove.push(item);
            } else {
                examsByCourse[item.course] = true;
                itemsToKeep.push(item);
            }
        } else {
            itemsToKeep.push(item);
        }
    }

    byDate[date] = itemsToKeep;
    if (itemsToMove.length > 0 && i > 0) {
        const prevDate = sortedDates[i - 1];
        byDate[prevDate].push(...itemsToMove);
    }
}

scheduledList.length = 0; // Clear
for (const date of sortedDates) {
    for (const item of byDate[date]) {
        item.date = date; // Update date just in case
        scheduledList.push(item);
    }
}

DATA.scheduled = scheduledList;
DATA.end = scheduledList[scheduledList.length-1].date;
DATA.totals.all = scheduledList.length;

const STORAGE_KEY="study-calendar-completed-v7";const THEME_KEY="study-calendar-theme";let userDone=new Set();try{userDone=new Set(JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]"))}catch(e){}let current=new Date(DATA.start+"T12:00:00");let selectedCourse="ALL";
const KIND_COLORS={"Lesson":"var(--accent)","Quiz":"var(--accent-2)","Assignment":"#ffb454","Exam":"var(--danger)","Survey":"var(--text-faint)"};const COURSE_PALETTE=["#8b93ff","#4fe0c1","#ffb454","#ff8aa3","#7dd3fc","#c4b5fd"];const COURSE_COLORS={};DATA.courses.forEach((c,i)=>{COURSE_COLORS[c.name]=COURSE_PALETTE[i%COURSE_PALETTE.length]});
function courseDisplay(c){return c==="Language Arts 12 A"?"Language Arts A":c}function isDone(sourceId){return userDone.has(sourceId)}function saveLocal(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify([...userDone]))}catch(e){}}
const scheduled=DATA.scheduled.map(x=>({...x}));const byDateFinal={};for(const x of scheduled){(byDateFinal[x.date]||=[]).push(x)}const courseTotals={};for(const c of DATA.courses){courseTotals[c.name]=scheduled.filter(x=>x.course===c.name).length}
const activeDays = Object.keys(byDateFinal).sort();
let currentModalDate = null;

function effortLabel(e){if(e<=2.2)return "Light";if(e<=6.8)return "Standard";return "Focus"}function dayKey(y,m,d){const dt=new Date(y,m,d);const mm=String(dt.getMonth()+1).padStart(2,"0");const dd=String(dt.getDate()).padStart(2,"0");return `${dt.getFullYear()}-${mm}-${dd}`}
function renderStats(){
    const done = userDone.size;
    const total = DATA.totals.all; // Currently 733 (Semester A only)
    
    // Multiply by 2 so Semester A only fills up to 50%, leaving room for Semester B later
    const progressTotal = total * 2; 
    const pct = progressTotal ? Math.min(100, Math.round(done / progressTotal * 100)) : 0;
    
    document.getElementById("allCount").textContent = total;
    document.getElementById("doneCount").textContent = done;
    document.getElementById("remainingCount").textContent = total - done;
    document.getElementById("progressText").textContent = pct + "%";
    document.getElementById("progressBar").style.width = pct + "%";
}
function renderCoursePills(){const box=document.getElementById("coursePills");box.innerHTML="";const allDone=scheduled.filter(x=>isDone(x.sourceId)).length;const allBtn=document.createElement("button");allBtn.className="pill"+(selectedCourse==="ALL"?" active":"");allBtn.innerHTML=`<span class="name"><span class="dot" style="background:var(--accent)"></span>All courses</span><span class="count">${allDone}/${DATA.totals.all}</span>`;allBtn.onclick=()=>{selectedCourse="ALL";renderAll()};box.appendChild(allBtn);DATA.courses.forEach((c)=>{const doneC=scheduled.filter(x=>x.course===c.name&&isDone(x.sourceId)).length;const btn=document.createElement("button");btn.className="pill"+(selectedCourse===c.name?" active":"");btn.innerHTML=`<span class="name"><span class="dot" style="background:${COURSE_COLORS[c.name]}"></span>${escapeHtml(courseDisplay(c.name))}</span><span class="count">${doneC}/${courseTotals[c.name]}</span>`;btn.onclick=()=>{selectedCourse=c.name;renderAll()};box.appendChild(btn)})}
function renderLegend(){const box=document.getElementById("kindLegend");box.innerHTML="";for(const [kind,color] of Object.entries(KIND_COLORS)){const row=document.createElement("div");row.className="legend-item";row.innerHTML=`<span class="dot" style="background:${color}"></span>${kind}`;box.appendChild(row)}}
function renderCalendar(){const y=current.getFullYear(),m=current.getMonth();document.getElementById("monthTitle").textContent=current.toLocaleDateString(undefined,{month:"long",year:"numeric"});const cal=document.getElementById("calendar");cal.innerHTML="";["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(w=>{const h=document.createElement("div");h.className="weekday";h.textContent=w;cal.appendChild(h)});const first=new Date(y,m,1),startDay=first.getDay();const last=new Date(y,m+1,0).getDate();const prevLast=new Date(y,m,0).getDate();const now=new Date();const todayKey=dayKey(now.getFullYear(),now.getMonth(),now.getDate());for(let i=0;i<42;i++){const cellDay=i-startDay+1;let yy=y,mm=m,dd=cellDay,out=false;if(cellDay<1){out=true;mm=m-1;dd=prevLast+cellDay;if(mm<0){mm=11;yy--}}else if(cellDay>last){out=true;mm=m+1;dd=cellDay-last;if(mm>11){mm=0;yy++}}const key=dayKey(yy,mm,dd);const beforeStart=key<DATA.start;const div=document.createElement("div");const items=(byDateFinal[key]||[]).filter(x=>selectedCourse==="ALL"||x.course===selectedCourse);div.className="day"+((out||beforeStart)?" out":"")+(key===todayKey?" today":"")+(items.length?"":" empty-day");const effort=items.reduce((s,x)=>s+x.effort,0);const doneCount=items.filter(x=>isDone(x.sourceId)).length;const pct=items.length?Math.round(doneCount/items.length*100):0;let html=`<div class="day-num"><span>${dd}</span><span class="load">${items.length?effortLabel(effort):""}</span></div>`;if(items.length){const byCourse={};for(const x of items){(byCourse[x.course]||=[]).push(x)}html+=`<div class="chips">`;for(const [course,courseItems] of Object.entries(byCourse)){const allDone=courseItems.every(x=>isDone(x.sourceId));const color=COURSE_COLORS[course]||"var(--text-faint)";const label=courseDisplay(course);html+=`<span class="chip${allDone?" all-done":""}"><span class="dot" style="background:${color}"></span>${escapeHtml(label)}${courseItems.length>1?` ×${courseItems.length}`:""}</span>`}html+=`</div><div class="day-progress"><i style="width:${pct}%"></i></div>`}div.innerHTML=html;if(items.length){div.addEventListener("click",()=>openDayModal(key,items))}cal.appendChild(div)}}

function openDayModal(key, items) {
    currentModalDate = key;
    const overlay = document.getElementById("dayModalOverlay");
    const title = document.getElementById("dayModalTitle");
    const sub = document.getElementById("dayModalSub");
    const list = document.getElementById("dayModalList");

    title.textContent = new Date(key + "T12:00:00").toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"});
    const doneCount = items.filter(x=>isDone(x.sourceId)).length;
    sub.textContent = `${doneCount}/${items.length} completed`;

    list.innerHTML = "";
    const byCourse = {};
    for(const x of items){ (byCourse[x.course] ||= []).push(x); }
    const sortedCourses = Object.keys(byCourse).sort((a,b)=>{ return DATA.courses.findIndex(c=>c.name===a) - DATA.courses.findIndex(c=>c.name===b); });

    for(const course of sortedCourses) {
        const courseItems = byCourse[course];
        const courseDoneCount = courseItems.filter(x=>isDone(x.sourceId)).length;
        const color = COURSE_COLORS[course] || "var(--text-faint)";
        const label = courseDisplay(course);

        const groupDiv = document.createElement("div");
        groupDiv.className = "course-group";

        const groupHead = document.createElement("div");
        groupHead.className = "course-group-head";
        groupHead.innerHTML = `
          <div class="cg-left">
            <span class="cg-dot" style="background:${color}"></span>
            <span class="cg-name">${escapeHtml(label)}</span>
          </div>
          <div class="cg-right">
            <span class="cg-count">${courseDoneCount}/${courseItems.length}</span>
            <span class="cg-chevron">▼</span>
          </div>
        `;

        const groupTasks = document.createElement("div");
        groupTasks.className = "course-group-tasks";

        for(const x of courseItems) {
            const t=document.createElement("div");
            t.className="task"+(isDone(x.sourceId)?" done":"");
            const kindColor=KIND_COLORS[x.kind]||"var(--text-faint)";
            t.innerHTML=`<input type="checkbox" ${isDone(x.sourceId)?"checked":""} aria-label="Mark complete"><div class="task-main"><div class="task-title">${escapeHtml(x.title)}</div><div class="task-meta"><span class="kind-dot" style="background:${kindColor}"></span><span>${escapeHtml(x.kind)}</span></div></div>`;
            t.querySelector("input").addEventListener("change",e=>{
                if(e.target.checked)userDone.add(x.sourceId);else userDone.delete(x.sourceId);
                save();renderStats();renderCoursePills();renderCalendar();renderSearch();
                const stillDone=items.filter(i=>isDone(i.sourceId)).length;
                sub.textContent=`${stillDone}/${items.length} completed`;
                const cStillDone=courseItems.filter(i=>isDone(i.sourceId)).length;
                groupHead.querySelector(".cg-count").textContent=`${cStillDone}/${courseItems.length}`;
            });
            groupTasks.appendChild(t);
        }

        groupHead.addEventListener("click", () => { groupDiv.classList.toggle("expanded"); });
        groupDiv.appendChild(groupHead);
        groupDiv.appendChild(groupTasks);
        list.appendChild(groupDiv);
    }
    
    // Update navigation button states
    const idx = activeDays.indexOf(key);
    const prevBtn = document.getElementById('prevDayBtn');
    const nextBtn = document.getElementById('nextDayBtn');
    
    if(idx > 0) {
        prevBtn.style.opacity = '1';
        prevBtn.style.pointerEvents = 'auto';
    } else {
        prevBtn.style.opacity = '0.3';
        prevBtn.style.pointerEvents = 'none';
    }
    
    if(idx < activeDays.length - 1) {
        nextBtn.style.opacity = '1';
        nextBtn.style.pointerEvents = 'auto';
    } else {
        nextBtn.style.opacity = '0.3';
        nextBtn.style.pointerEvents = 'none';
    }

    overlay.classList.add("open");
}

function navigateDay(delta) {
    if (!currentModalDate) return;
    const idx = activeDays.indexOf(currentModalDate);
    const newIdx = idx + delta;
    if (newIdx >= 0 && newIdx < activeDays.length) {
        const newDate = activeDays[newIdx];
        const newItems = byDateFinal[newDate] || [];
        openDayModal(newDate, newItems);
        const overlay = document.getElementById("dayModalOverlay");
        overlay.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

document.getElementById("prevDayBtn").onclick = () => navigateDay(-1);
document.getElementById("nextDayBtn").onclick = () => navigateDay(1);

document.getElementById("closeDayModal").onclick=()=>document.getElementById("dayModalOverlay").classList.remove("open");document.getElementById("dayModalOverlay").addEventListener("click",e=>{if(e.target.id==="dayModalOverlay")e.currentTarget.classList.remove("open")});
function renderSearch(){const q=(document.getElementById("searchInput").value||"").trim().toLowerCase();const el=document.getElementById("searchResults");const hits=scheduled.filter(x=>{const hay=[x.title,x.course,x.module,x.kind,x.date].join(" ").toLowerCase();return !q||hay.includes(q)}).slice(0,500);el.innerHTML=hits.length?hits.map(x=>`<div class="result"><div><b>${escapeHtml(x.title)}</b><small>${escapeHtml(courseDisplay(x.course))} · ${escapeHtml(x.module)} · ${escapeHtml(fmtDate(x.date))}</small></div><span class="result-tag">${isDone(x.sourceId)?"Done":"Planned"}</span></div>`).join(""):`<div class="empty">No matching activities.</div>`}function fmtDate(s){return new Date(s+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function renderAll(){renderStats();renderCoursePills();renderCalendar();renderSearch();renderLegend();}
document.getElementById("prevBtn").onclick=()=>{current.setMonth(current.getMonth()-1);renderCalendar()};document.getElementById("nextBtn").onclick=()=>{current.setMonth(current.getMonth()+1);renderCalendar()};document.getElementById("todayBtn").onclick=()=>{current=new Date();renderCalendar()};
document.getElementById("searchBtn").onclick=()=>{document.getElementById("searchOverlay").classList.add("open");renderSearch();document.getElementById("searchInput").focus()};document.getElementById("closeSearch").onclick=()=>document.getElementById("searchOverlay").classList.remove("open");document.getElementById("searchOverlay").addEventListener("click",e=>{if(e.target.id==="searchOverlay")document.getElementById("searchOverlay").classList.remove("open")});document.getElementById("searchInput").oninput=renderSearch;
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);document.getElementById("themeBtn").textContent=t==="dark"?"🌙":"☀️";try{localStorage.setItem(THEME_KEY,t)}catch(e){}}document.getElementById("themeBtn").onclick=()=>{const cur=document.documentElement.getAttribute("data-theme");applyTheme(cur==="dark"?"light":"dark")};const prefersDark=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;let savedTheme=null;try{savedTheme=localStorage.getItem(THEME_KEY)}catch(e){}applyTheme(savedTheme||(prefersDark?"dark":"light"));
document.addEventListener("keydown",e=>{if(e.key==="Escape"){document.getElementById("searchOverlay").classList.remove("open");document.getElementById("dayModalOverlay").classList.remove("open")}});

// --- SUPABASE SYNC LOGIC ---
let saveTimeout;
async function loadFromCloud() {
    try {
        const { data, error } = await sb.from('progress').select('completed').eq('id', 1).single();
        if (error) throw error;
        if (data && Array.isArray(data.completed)) {
            userDone = new Set(data.completed);
            saveLocal();
        }
    } catch(e) {
        console.warn("Cloud load failed or no data yet. Falling back to local storage.", e);
    } finally {
        renderAll();
    }
}

function save() {
    saveLocal(); // Instant local save so UI feels snappy
    if (!sb) return;
    
    // Debounce the cloud save so we don't spam the database if you click 10 boxes in 2 seconds
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(async () => {
        try {
            const { error } = await sb.from('progress').upsert({ id: 1, completed: [...userDone] });
            if (error) console.error("Cloud save failed:", error);
        } catch(e) {
            console.error("Cloud save error:", e);
        }
    }, 600); 
}

// Start the app by loading from the cloud
loadFromCloud();
</script>
